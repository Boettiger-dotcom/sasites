<!DOCTYPE html>
<html lang="en-ZA">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page Not Found - SA Sites</title>
<meta name="robots" content="noindex, follow" />
<link rel="icon" href="assets/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: #001240; }
  body {
    font-family: "Helvetica Neue", Helvetica, "Segoe UI", system-ui, sans-serif;
    color: #FDFCFA;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px;
    background: linear-gradient(to bottom right, #001240 0%, #002366 55%, #00396e 100%);
  }
  .logo { height: 40px; width: auto; filter: brightness(0) invert(1); margin-bottom: 48px; }
  .code {
    font-size: clamp(64px, 16vw, 120px);
    font-weight: 700;
    letter-spacing: -0.04em;
    line-height: 1;
    background: linear-gradient(100deg, #AFC6FF 0%, #6E9BF0 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  h1 { font-size: clamp(24px, 4vw, 32px); letter-spacing: -0.02em; margin: 16px 0 10px; }
  p { color: rgba(255,255,255,0.8); max-width: 440px; margin: 0 auto 32px; line-height: 1.6; }
  .btn {
    display: inline-block;
    background: #FDFCFA;
    color: #002366;
    font-weight: 600;
    text-decoration: none;
    padding: 14px 28px;
    border-radius: 8px;
    transition: filter .2s ease;
  }
  .btn:hover { filter: brightness(0.93); }
</style>
</head>
<body>
  <a href="/"><img class="logo" src="assets/logo.png" alt="SA Sites" width="498" height="224"></a>
  <div class="code">404</div>
  <h1>Page not found</h1>
  <p>The page you're looking for doesn't exist or has moved. Let's get you back on track.</p>
  <a class="btn" href="/">Back to home</a>
</body>
</html>
